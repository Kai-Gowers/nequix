# normalization constants copied from nequix-mp-1.yml (needed for model
# construction; can't be recomputed from this dataset — see note at top)
avg_n_edges: 1932.8392640079926
avg_n_neighbors: 57.413687022442645
avg_n_nodes: 31.196903505120307
max_n_edges: 34704
max_n_nodes: 444
scale: 0.8066479563713074
shift: 0.16502578765761478

# model specific — identical architecture to nequix-mp-1
cutoff: 6.0
hidden_irreps: "128x0e + 64x1o + 32x2e + 32x3o"
lmax: 3
n_layers: 4
radial_basis_size: 8
radial_mlp_size: 64
radial_mlp_layers: 2
radial_polynomial_p: 6.0
mlp_init_scale: 4.0
index_weights: false
layer_norm: true
kernel: false  # openequivariance (oeq extra) not installed in this env

# training specific
extra_train_steps: 0  # cotraining disabled — see note above
optimizer: "adam"
# 10x the fine-tuning LR (1e-4) — that value is tuned for gently nudging an
# already-good pretrained model, not for optimizing random-init weights from
# scratch. No warmup/decay schedule implemented in pft/train.py, so this stays
# a flat LR; revisit if training is unstable.
learning_rate: 0.001
checkpoint_grad_energy: true  # hessian target needs grad-of-grad through the full network; without oeq kernels this OOMs on a single GPU without checkpointing

grad_clip_norm: 100.0
weight_decay: 1.0e-3
batch_size: 2  # per device -- small on purpose, hessian grad-of-grad is memory-hungry per node/edge
n_graph: 4   # maximum number of graphs in a batch (+1 for padding)
n_epochs: 600  # 4x the fine-tuning budget — cold-start random init needs more steps to converge; early stopping below should cut this short once val loss plateaus
early_stopping_patience: 60  # stop if val loss hasn't improved in 60 epochs (30 checks at val_every=2)
energy_weight: 0.0  # our structures carry no real energy label (relaxed equilibrium, zero-filled)
force_weight: 20.0  # forces are genuinely ~0 at these relaxed equilibrium structures
stress_weight: 5.0  # stress is genuinely ~0 at these relaxed equilibrium structures
hessian_weight: 100.0  # main training signal — force-constant Hessian from phonopy
val_every: 2
log_every: 10  # more frequent than upstream default (100) since this dataset is tiny (~3 steps/epoch)
ema_decay: 0.999
