state_path: "checkpoints/nequix-healthy-2d-pft-v2-seed1.pkl"
resume_from: "checkpoints/nequix-healthy-2d-pft-v2-seed1.pkl"
finetune_from: "models/nequix-mp-1.nqx"
seed: 1  # training-seed-noise-floor check: identical split/data/hyperparameters
         # to nequix-healthy-2d-pft-v2.yml, only the weight-init/data-order seed
         # differs (v2.yml relies on the train.py default of 0) — tests whether
         # v2's headline holdout numbers are stable to training-run noise alone.

# dataset specific — same split as nequix-healthy-2d-pft-v2.yml, unchanged.
# curated healthy subset from workflow/FINAL_RESULTS_HEALTHY (47 train / 6 val
# materials out of 73 total; 20 materials held out entirely as a true
# generalization test — 14 novel-chemistry (Ga/In monochalcogenide-dimer
# family + BN family) + 6 novel-pairing (specific TMD-TMD heterobilayer
# combinations withheld while every individual TMD element/monolayer/homobilayer
# stays in training). See workflow/nequix_datasets/v2_73healthy_split/{train,val,
# holdout}/materials.txt for the exact material lists, and
# nequix/scripts/eval_healthy2d_finetune.py for the held-out evaluation.
train_path: "data/healthy_2d_v2/train.aselmdb"
val_path: "data/healthy_2d_v2/val.aselmdb"

# avg/max_n_edges/n_nodes deliberately NOT baked in here (unlike v1) — this is a
# new dataset (47 materials, different mix than v1's 41) so the old numbers don't
# apply. nequix/pft/train.py::train() auto-computes these via dataset_stats() when
# any of the 4 stats keys are missing from config — a one-time cost at the start
# of this run, not worth precomputing separately for a dataset this size.

# no MPtrj cotraining data available locally — cotraining disabled below
# (extra_train_steps: 0), these paths just need to point at *something* valid
# since the training loop always constructs the extra dataset objects.
extra_train_path: "data/healthy_2d_v2/train.aselmdb"
extra_val_path: "data/healthy_2d_v2/val.aselmdb"

# training specific — deliberately identical to v2 (seed excepted) so training
# noise is the only variable being tested
extra_train_steps: 0  # cotraining disabled — see note above; documented next
                       # lever to pull if the held-out generalization test still
                       # shows catastrophic forgetting (see project memory)
optimizer: "adam"
learning_rate: 0.0001
checkpoint_grad_energy: true  # hessian target needs grad-of-grad through the full network; without oeq kernels this OOMs on a single GPU without checkpointing

grad_clip_norm: 100.0
weight_decay: 1.0e-3
batch_size: 2  # approximate batch size NOTE: per device -- small on purpose, same reasoning as v1: hessian grad-of-grad is memory-hungry per node/edge. Revisit if OOM (this dataset's structures are similar sizes to v1's, not larger)
n_graph: 4   # maximum number of graphs in a batch (+1 for padding)
n_epochs: 150
energy_weight: 0.0  # our structures carry no real energy label (relaxed equilibrium, zero-filled)
force_weight: 20.0  # forces are genuinely ~0 at these relaxed equilibrium structures
stress_weight: 5.0  # stress is genuinely ~0 at these relaxed equilibrium structures
hessian_weight: 100.0  # main training signal — force-constant Hessian from phonopy
val_every: 2
log_every: 10  # more frequent than upstream default (100) since this dataset is tiny (~3 steps/epoch)
ema_decay: 0.999
kernel: false  # openequivariance (oeq extra) not installed in this env — set true after installing it for speed
