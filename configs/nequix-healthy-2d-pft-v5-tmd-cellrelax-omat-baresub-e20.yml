# V5 CELLRELAX RETRAIN (2026-10-10): identical to nequix-healthy-2d-pft-v4-tmd-omat-baresub-e20.yml except the
# data paths. Same 39/3/6 split (workflow/nequix_datasets/v5_tmd_cellrelax = v4_tmd_only lists); the 16 materials
# whose reference cells carried +0.7..+2.1 GPa residual PBE+D3 stress (MoS2/WS2/WSe2 and 13 bilayers, workflow
# cellrelax campaign) now have Hessians / forces / stress / energy at their ISIF=4-refined cells
# (workflow/FINAL_RESULTS_BARE_PBE_SUBTRACT_CELLRELAX); the other 32 rows are unchanged
# (workflow/FINAL_RESULTS_BARE_PBE_SUBTRACT). Built by explicit_dispersion/build_bare_subtract_dataset_cellrelax.py.
#
state_path: "checkpoints/nequix-healthy-2d-pft-v5-tmd-cellrelax-omat-baresub-e20.pkl"
# ENERGY-WEIGHT ABLATION (2026-10-07): identical to nequix-healthy-2d-pft-v4-tmd-omat-baresub.yml except
# energy_weight 0 -> 20 (the upstream PFT default). Same data (bare-subtract rows with real stress, forces = -F_D3(eq)).
resume_from: "checkpoints/nequix-healthy-2d-pft-v5-tmd-cellrelax-omat-baresub-e20.pkl"
finetune_from: "models/nequix-omat-1.nqx"

# BARE-PBE-SUBTRACT + REAL STRESS (2026-10-07): identical to nequix-healthy-2d-pft-v4-tmd-omat-bared3.yml
# except the data paths. Targets come from workflow/FINAL_RESULTS_BARE_PBE_SUBTRACT (FORCE_SETS-level D3
# subtraction, eq-force removed, hiphive refit on 25/48) and every row carries the REAL bare-PBE unit-cell
# stress (relaxation OUTCAR minus D3) instead of the stress = 0 / -sigma_D3 placeholder used by every earlier
# fine-tune. forces = 0 (bare equilibrium by construction), energy = bare unit-cell energy x n_sc/n_uc (weight 0).
# Built by explicit_dispersion/build_bare_subtract_dataset.py.
#
# (previous header kept for lineage)
# EXPLICIT-DISPERSION / DELTA-LEARNING (2026-09-15): identical to nequix-healthy-2d-pft-v4-tmd-omat.yml
# except the data paths. Targets have the VASP-matched DFT-D3(BJ) term subtracted
# (see explicit_dispersion/README.md): hessian = FC_ref - FC_D3, forces = -F_D3, stress = -sigma_D3
# (nonzero now: the geometry is a PBE+D3 minimum, not a PBE one), energy = -E_D3 (weight 0).
# At inference the cached FC_D3 / analytic D3 term is added back (explicit_dispersion/eval_explicit_dispersion.py).
# Base model nequix-omat-1 was itself trained without D3, so bare PBE is the natural target for it.
#
# BASE-MODEL ABLATION (2026-09-15): byte-identical to nequix-healthy-2d-pft-v4-tmd.yml
# except finetune_from/state paths — starts from nequix-omat-1 instead of nequix-mp-1,
# to test whether the pretrained base model matters on the same 48-TMD data/split.
#
# dataset specific — TMD-only tightening retrain. Restricted to the 48 pure
# Mo/W TMD materials confirmed on 2026-09-07 to be the publication scope (all
# individually clear the 0.15 THz near-DFT threshold under the v2 73-material
# fine-tune). All 25 non-TMD materials (Ti, Ga/In, BN, Xenes) removed entirely
# from train/val/holdout — goal is to see whether dedicating full training
# capacity to TMD chemistry tightens margins further, especially for the
# closest-to-threshold held-out novel-pairing materials (MoSe2_WSe2_2H was the
# worst case in v2 at 0.1343 THz).
#
# Split: 39 train / 3 val / 6 holdout (39/48 in v2 kept the same tags, plus
# WSe2 moved from val to train so every constituent monolayer of the 6 held-out
# heterobilayer pairings — WS2, WSe2, MoSe2, MoTe2 — is present in training,
# not just validation). Held-out set is unchanged from v2's novel-pairing test:
# WS2_WSe2_2H/3R, MoSe2_WSe2_2H/3R, MoTe2_WS2_2H/3R.
# See workflow/nequix_datasets/v4_tmd_only/{train,val,holdout}/materials.txt
# for the exact material lists.
train_path: "explicit_dispersion/data/v5_tmd_cellrelax_bare_subtract/train/dataset.aselmdb"
val_path: "explicit_dispersion/data/v5_tmd_cellrelax_bare_subtract/val/dataset.aselmdb"

# avg/max_n_edges/n_nodes deliberately NOT baked in here — different, smaller
# material mix than v2, so the old numbers don't apply; auto-computed at start.

# no MPtrj cotraining data available locally — cotraining disabled below
extra_train_path: "explicit_dispersion/data/v5_tmd_cellrelax_bare_subtract/train/dataset.aselmdb"
extra_val_path: "explicit_dispersion/data/v5_tmd_cellrelax_bare_subtract/val/dataset.aselmdb"

# training specific — identical to v2, only paths above differ, so any result
# difference is attributable to the TMD-only data restriction, not a recipe change
extra_train_steps: 0
optimizer: "adam"
learning_rate: 0.0001
checkpoint_grad_energy: true

grad_clip_norm: 100.0
weight_decay: 1.0e-3
batch_size: 2
n_graph: 4
n_epochs: 150
energy_weight: 20.0  # e20 (2026-10-07): Nequix PFT default restored; rows now carry real bare energies (omat-1 zero-shot is within 0.007-0.024 eV/atom of them)
force_weight: 20.0
stress_weight: 5.0
hessian_weight: 100.0
val_every: 2
log_every: 10
ema_decay: 0.999
kernel: false
