state_path: "checkpoints/nequix-healthy-2d-pft-v3-75pct.pkl"
resume_from: "checkpoints/nequix-healthy-2d-pft-v3-75pct.pkl"
finetune_from: "models/nequix-mp-1.nqx"

# Data-scaling curve point: 75% of v3's 40-material training pool (30 materials),
# a deterministic nested subset (random.Random(42).sample of the 40 train names,
# first 30 of the shuffle — same shuffle order used for the 50pct config so
# 50pct's materials are a strict subset of this one). Same val/test sets as v3
# (unchanged) so this is a fair apples-to-apples comparison of training-set size
# only — everything else (hyperparameters, val/test materials) is identical to
# nequix-healthy-2d-pft-v3.yml. See
# workflow/nequix_datasets/v3_2h3r_scaling/train_75pct/materials.txt for the
# exact list.
train_path: "data/healthy_2d_v3_scaling/train_75pct.aselmdb"
val_path: "data/healthy_2d_v3/val.aselmdb"

# no MPtrj cotraining data available locally — cotraining disabled below
# (extra_train_steps: 0), these paths just need to point at *something* valid
# since the training loop always constructs the extra dataset objects.
extra_train_path: "data/healthy_2d_v3_scaling/train_75pct.aselmdb"
extra_val_path: "data/healthy_2d_v3/val.aselmdb"

# training specific — deliberately identical to v3 (see nequix-healthy-2d-pft-v3.yml)
# so training-set size is the only variable being tested
extra_train_steps: 0  # cotraining disabled — see note above
optimizer: "adam"
learning_rate: 0.0001
checkpoint_grad_energy: true  # hessian target needs grad-of-grad through the full network; without oeq kernels this OOMs on a single GPU without checkpointing

grad_clip_norm: 100.0
weight_decay: 1.0e-3
batch_size: 2  # approximate batch size NOTE: per device -- small on purpose, same reasoning as v1/v2/v3: hessian grad-of-grad is memory-hungry per node/edge.
n_graph: 4   # maximum number of graphs in a batch (+1 for padding)
n_epochs: 150
energy_weight: 0.0  # our structures carry no real energy label (relaxed equilibrium, zero-filled)
force_weight: 20.0  # forces are genuinely ~0 at these relaxed equilibrium structures
stress_weight: 5.0  # stress is genuinely ~0 at these relaxed equilibrium structures
hessian_weight: 100.0  # main training signal — force-constant Hessian from phonopy
val_every: 2
log_every: 10  # more frequent than upstream default (100) since this dataset is tiny
ema_decay: 0.999
kernel: false  # openequivariance (oeq extra) not installed in this env — set true after installing it for speed
